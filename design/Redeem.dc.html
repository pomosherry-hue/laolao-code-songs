<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>输入兑换码看全集</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3B2A1A;text-decoration:none}a:hover{color:#5C3D14}
input::placeholder{color:#A8957A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF7E8; color: #3B2A1A; font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 16px 28px 16px; background: #FFC93C; border-radius: 0 0 28px 28px">
    <a href="Main.dc.html" aria-label="返回首页" style="align-self: flex-start; width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3B2A1A" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="width: 110px; height: 110px; border-radius: 55px; background: #3B2A1A; display: flex; align-items: center; justify-content: center">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#FFD45C" stroke-width="2" aria-hidden="true"><circle cx="8" cy="12" r="4.5"></circle><path d="M12.5 12H22M19 12v3.5M22 12v2.5"></path></svg>
    </div>
    <div style="font-size: 28px; font-weight: 800">输入兑换码看全集</div>
    <div style="font-size: 18px; color: #5C3D14">输进去以后，12 首歌和小游戏都能用</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 16px">
    <label for="code" style="font-size: 20px; font-weight: 700">兑换码</label>
    <input id="code" placeholder="比如 LAOLAO2026" style="height: 68px; box-sizing: border-box; border-radius: 34px; border: 2px solid #D9C6A5; background: #FFFFFF; color: #3B2A1A; padding: 0 24px; font-family: inherit; font-size: 24px; letter-spacing: 2px">
    <button onClick="{{submit}}" style="height: 64px; border-radius: 32px; border: none; background: #3B2A1A; color: #FFD45C; font-family: inherit; font-size: 22px; font-weight: 700">确定</button>
    <sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 14px 18px; border-radius: 20px; background: #FFE9B0; font-size: 20px; line-height: 1.4; color: #3B2A1A">好嘞！全部 12 首都打开了。</div>
    </sc-if>
  </div>

  <div style="flex: 1"></div>

  <div style="margin: 0 16px 28px 16px; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 4px 12px rgba(122,78,18,0.12)">
    <div style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: #FFE9B0; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #C42A23">姥</div>
    <div style="font-size: 18px; line-height: 1.5; color: #5C3D14">不会输？让孩子帮你输一下，或者问问给你兑换码的人。</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ok: false }; }
  renderVals() {
    var self = this;
    return { ok: this.state.ok, submit: function () { self.setState({ ok: true }); } };
  }
}
</script>
</body>
</html>
