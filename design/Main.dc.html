<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>姥姥快乐密码歌 首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#3B2A1A;text-decoration:none}a:hover{color:#5C3D14}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #FFF7E8; color: #3B2A1A; font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding: 20px 16px 22px 16px; background: #FFC93C; border-radius: 0 0 28px 28px">
    <div style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 32px; border: 3px solid #FFFFFF; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; color: #C42A23">姥</div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 24px; font-weight: 800; color: #3B2A1A">姥姥来啦！</div>
      <div style="margin-top: 2px; font-size: 17px; color: #5C3D14">每首歌藏着一个快乐密码</div>
    </div>
    <a href="Redeem.dc.html" style="height: 48px; padding: 0 14px; border-radius: 24px; background: #3B2A1A; color: #FFD45C; display: flex; align-items: center; gap: 6px; font-size: 17px; font-weight: 700; flex-shrink: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFD45C" stroke-width="2.4" aria-hidden="true"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v3M21 12v2"></path></svg>兑换码</a>
  </div>

  <a href="Player.dc.html" style="margin: 14px 16px 0 16px; padding: 12px 12px 12px 18px; border-radius: 20px; background: #3B2A1A; color: #FFFFFF; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1">
      <div style="font-size: 17px; color: #CDBBA3">今天的歌</div>
      <div style="margin-top: 2px; font-size: 22px; font-weight: 700; color: #FFFFFF">雨停了，咱不记仇</div>
    </div>
    <div style="height: 52px; padding: 0 22px; border-radius: 26px; background: #FFC93C; color: #2B1D12; display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="#2B1D12"></path></svg>听</div>
  </a>

  <div style="display: flex; gap: 10px; padding: 14px 16px 4px 16px">
    <div style="height: 48px; padding: 0 20px; border-radius: 24px; background: #3B2A1A; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center">全部</div>
    <div style="height: 48px; padding: 0 20px; border-radius: 24px; background: #FFFFFF; color: #3B2A1A; font-size: 18px; display: flex; align-items: center">第一季</div>
    <div style="height: 48px; padding: 0 20px; border-radius: 24px; background: #FFFFFF; color: #3B2A1A; font-size: 18px; display: flex; align-items: center">第二季</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 12px 16px 120px 16px">
    <sc-for list="{{songs}}" as="s" hint-placeholder-count="4">
      <a href="{{s.href}}" style="display: block">
        <div style="position: relative; height: 128px; border-radius: 20px; border: 3px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 6px 16px rgba(122,78,18,0.18); background: {{s.bg}}; overflow: hidden; display: flex; align-items: center; justify-content: center">
          <div style="position: absolute; left: 10px; top: 10px; padding: 3px 12px; border-radius: 12px; background: rgba(59,42,26,0.75); color: #FFFFFF; font-size: 15px; font-weight: 700">第 {{s.no}} 首</div>
          <div style="font-size: 44px; font-weight: 800; color: {{s.fg}}; letter-spacing: 4px">{{s.code}}</div>
          <sc-if value="{{s.locked}}" hint-placeholder-val="{{ false }}">
            <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(43,29,18,0.35); display: flex; align-items: center; justify-content: center">
              <div style="width: 56px; height: 56px; border-radius: 28px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3B2A1A" stroke-width="2.2" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
              </div>
            </div>
          </sc-if>
        </div>
        <div style="margin-top: 8px; font-size: 19px; font-weight: 700; color: #3B2A1A">{{s.name}}</div>
      </a>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 34px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(59,42,26,0.18)">
    <a href="Main.dc.html" style="height: 54px; padding: 0 18px; border-radius: 27px; background: #3B2A1A; color: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 700; white-space: nowrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>听歌</a>
    <a href="Game.dc.html" style="height: 54px; padding: 0 18px; border-radius: 27px; color: #5C3D14; display: flex; align-items: center; gap: 6px; font-size: 18px; white-space: nowrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C3D14" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>动动脑</a>
    <a href="Code.dc.html" style="height: 54px; padding: 0 18px; border-radius: 27px; color: #5C3D14; display: flex; align-items: center; gap: 6px; font-size: 18px; white-space: nowrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C3D14" stroke-width="2.2" aria-hidden="true"><path d="M12 21s-7-4.5-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.5-9 9-9 9z"></path></svg>密码</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = '#3B2A1A', light = '#FFFFFF';
    var list = [
      ['1','爱','俺妈那条红围裙','#A8443F',light,false],
      ['2','谦虚','弯下腰才看见花','#8B7553',light,false],
      ['3','原谅','雨停了，咱不记仇','#8F96A3',dark,false],
      ['4','耐心','急啥，慢慢来','#2F5A45',light,true],
      ['5','陪伴','爸，我在这儿呢','#9C8AAE',dark,true],
      ['6','感恩','数数咱家的福','#E79A55',dark,true]
    ];
    return {
      songs: list.map(function (r) {
        return { no: r[0], code: r[1], name: r[2], bg: r[3], fg: r[4], locked: r[5], href: r[5] ? 'Redeem.dc.html' : 'Player.dc.html' };
      })
    };
  }
}
</script>
</body>
</html>
