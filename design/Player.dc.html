<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>听歌：雨停了，咱不记仇</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#FFC93C;text-decoration:none}a:hover{color:#FFD45C}
@keyframes drop{0%{transform:translateY(-30px);opacity:0}15%{opacity:.9}100%{transform:translateY(260px);opacity:0}}
.rain{position:absolute;width:3px;height:18px;border-radius:2px;background:#FFFFFF;animation:drop 3.2s linear infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2B1D12; color: #FFFFFF; font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 14px; padding: 16px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Main.dc.html" aria-label="返回首页" style="width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1">
      <div style="font-size: 22px; font-weight: 700; color: #FFFFFF">雨停了，咱不记仇</div>
      <div style="font-size: 16px; color: #CDBBA3">第 3 首 · 快乐密码：原谅</div>
    </div>
  </div>

  <div style="position: relative; height: 250px; border-radius: 22px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #8F96A3, #2B1D12 80%)">
    <span class="rain" style="left: 40px; animation-delay: 0s"></span>
    <span class="rain" style="left: 95px; animation-delay: 1.1s"></span>
    <span class="rain" style="left: 150px; animation-delay: 2.2s"></span>
    <span class="rain" style="left: 205px; animation-delay: .6s"></span>
    <span class="rain" style="left: 260px; animation-delay: 1.7s"></span>
    <span class="rain" style="left: 310px; animation-delay: 2.7s"></span>
    <div style="position: absolute; left: 50%; top: 40px; transform: translateX(-50%); width: 130px; height: 150px; box-sizing: border-box; border: 6px solid rgba(255,255,255,.85); border-radius: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; background: rgba(255,255,255,.85)">
      <div style="background: #A9B0BC"></div><div style="background: #A9B0BC"></div>
      <div style="background: #A9B0BC"></div><div style="background: #A9B0BC"></div>
    </div>
    <div style="position: absolute; right: 12px; bottom: 12px; width: 52px; height: 52px; border-radius: 26px; border: 3px solid #FFFFFF; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #C42A23">姥</div>
    <div style="position: absolute; left: 12px; bottom: 12px; font-size: 13px; color: rgba(255,255,255,.85)">音乐由 AI 生成 · 词与画：晨霞子</div>
  </div>

  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
    <div style="padding: 10px 14px; border-radius: 14px; font-size: 20px; color: rgba(255,255,255,.55)">那天下完雨 我站窗户跟前</div>
    <div style="padding: 10px 14px; border-radius: 14px; font-size: 20px; color: rgba(255,255,255,.55)">瞅见玻璃上那个 苦瓜脸的大姐</div>
    <div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.1); font-size: 26px; font-weight: 700; color: #FFC93C">雨停了 雨停了 窗户咱敞开</div>
    <div style="padding: 10px 14px; border-radius: 14px; font-size: 20px; color: rgba(255,255,255,.55)">那点事儿 咱不往心里揣</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,.15)"><div style="width: 42%; height: 8px; border-radius: 4px; background: #FFC93C"></div></div>
    <div style="display: flex; justify-content: space-between; font-size: 15px; color: #CDBBA3"><span>1:21</span><span>3:12</span></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-around">
    <button aria-label="上一首" style="width: 60px; height: 60px; border-radius: 30px; border: none; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14L8 12z M6 5h2v14H6z" fill="#FFFFFF"></path></svg>
    </button>
    <button aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 88px; height: 88px; border-radius: 44px; border: none; background: #FFC93C; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
        <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6z M14 4h4v16h-4z" fill="#2B1D12"></path></svg>
      </sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
        <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="#2B1D12"></path></svg>
      </sc-if>
    </button>
    <button aria-label="下一首" style="width: 60px; height: 60px; border-radius: 30px; border: none; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l10-7z M16 5h2v14h-2z" fill="#FFFFFF"></path></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-bottom: 8px">
    <button onClick="{{toggleBacking}}" style="height: 56px; border-radius: 28px; border: 2px solid #D9C6A5; background: {{backingBg}}; color: {{backingFg}}; font-family: inherit; font-size: 18px; font-weight: 700">{{backingLabel}}</button>
    <a href="Code.dc.html" style="height: 56px; border-radius: 28px; background: #FFFFFF; color: #3B2A1A; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">看快乐密码</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { playing: true, backing: false }; }
  renderVals() {
    var self = this, s = this.state;
    return {
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? '暂停' : '播放',
      toggle: function () { self.setState({ playing: !s.playing }); },
      backingLabel: s.backing ? '正在放伴奏' : '跟着唱（伴奏）',
      backingBg: s.backing ? '#FFC93C' : 'transparent',
      backingFg: s.backing ? '#2B1D12' : '#FFFFFF',
      toggleBacking: function () { self.setState({ backing: !s.backing }); }
    };
  }
}
</script>
</body>
</html>
